    Estructura de una etiqueta HTML 
    <equiqueta atributo="valor"> contenido </etiqueta>
-->

<!-- 
Cuerpo de un documento HTML

doctype (para versión del HTML)
html
    head
        title
        link
    body    
        h1
        p (parráfo)
        imagen
-->

<!DOCTYPE html>

        h1 ... h6 para headings
